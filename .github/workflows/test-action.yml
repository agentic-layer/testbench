name: Test Action

on:
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/agent-evaluate.yml'
      - 'scripts/setup.py'

jobs:
  validate-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate action.yml
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

      - name: Validate reusable workflow
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/agent-evaluate.yml'))"

      - name: Validate action inputs match workflow inputs
        run: |
          ACTION_INPUTS=$(python3 -c "
          import yaml
          with open('action.yml') as f:
              data = yaml.safe_load(f)
          for k in sorted(data.get('inputs', {}).keys()):
              print(k)
          ")
          echo "Action inputs validated: $(echo "$ACTION_INPUTS" | wc -l) inputs found"
