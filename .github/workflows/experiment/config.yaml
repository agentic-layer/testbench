# Pipeline Configuration
# Run with: uv run testworkflow config.yaml

# Agent to evaluate — must expose A2A protocol endpoint
agent:
  url: "http://localhost:11010"

# Evaluation phase configuration
evaluate:
  # When true (default), the pipeline exits non-zero if any metric evaluation fails.
  # Set to false to always succeed regardless of metric pass/fail results.
  fail_on_metric_failure: true

# Experiment metadata
experiment:
  name: "my-evaluation"

# Workflow execution metadata
workflow:
  execution_id: "auto"    # defaults to $GITHUB_RUN_ID or UUID
  execution_number: 1     # defaults to $GITHUB_RUN_NUMBER or 1

# Dataset — embedded inline (mirrors the Experiment CRD's dataset.inline).
# Alternatives: source: url | file | s3 | experiment.
dataset:
  source: inline
  inline:
    llm_as_a_judge_model: gemini-2.5-flash-lite
    default_threshold: 0.9
    scenarios:
      - name: "Weather in New York"
        steps:
          - input: "What is the weather like in New York right now?"
            reference:
              tool_calls:
                - name: get_weather
                  args:
                    city: "New York"
              topics:
                - weather
            metrics:
              - metric_name: AgentGoalAccuracyWithoutReference
              - metric_name: ToolCallAccuracy
              - metric_name: TopicAdherence
                parameters:
                  mode: precision
