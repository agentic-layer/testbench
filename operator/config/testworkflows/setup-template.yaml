apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflowTemplate
metadata:
  name: setup-template
  namespace: testkube
  labels:
    app.kubernetes.io/name: testbench
    app.kubernetes.io/version: "0.0.1"
    testkube.io/test-category: ragas-evaluation
    app: testworkflows
spec:
  config:
    bucket:
      type: string
      description: "S3/MinIO bucket name containing the dataset"
    key:
      type: string
      description: "S3/MinIO object key (path to dataset file in .csv / .json / .parquet format)"
  steps:
    - name: setup
      artifacts:
        paths:
          - "data/datasets/experiment.json"
      run:
        image: ghcr.io/agentic-layer/testbench/testworkflows:latest
        imagePullPolicy: IfNotPresent
        args:
          - -m
          - testbench.setup
          - "{{ config.bucket }}"
          - "{{ config.key }}"
