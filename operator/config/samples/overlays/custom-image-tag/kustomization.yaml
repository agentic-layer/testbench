apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# When using this overlay against a release artifact, download the released
# install.yaml into this directory and replace the resources entry with
# `install.yaml`, e.g.:
#
#   curl -L -o install.yaml \
#     https://github.com/agentic-layer/testbench/releases/latest/download/install.yaml
#   # Browse releases at https://github.com/agentic-layer/testbench/releases
#
#   resources:
#     - install.yaml
#
# For in-tree development, this references the kustomize source directly.
resources:
  - ../../../default

images:
  - name: ghcr.io/agentic-layer/testbench/testworkflows
    newTag: my-custom-tag
