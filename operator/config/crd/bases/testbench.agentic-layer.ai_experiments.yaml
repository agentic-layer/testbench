---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: experiments.testbench.agentic-layer.ai
spec:
  group: testbench.agentic-layer.ai
  names:
    kind: Experiment
    listKind: ExperimentList
    plural: experiments
    shortNames:
    - exp
    singular: experiment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef.name
      name: Agent
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Experiment is the Schema for the experiments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExperimentSpec defines the desired state of Experiment
            properties:
              agentRef:
                description: Reference to the Agent to evaluate
                properties:
                  name:
                    description: Name of the Agent resource
                    type: string
                  namespace:
                    description: Namespace of the Agent resource
                    type: string
                required:
                - name
                type: object
              aiGatewayRef:
                description: |-
                  AiGatewayRef references an AiGateway resource for LLM access during evaluation.
                  Only Name and Namespace fields are used.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              dataset:
                description: Source of the test dataset
                properties:
                  inline:
                    description: Inline dataset with scenarios
                    properties:
                      defaultThreshold:
                        description: Default threshold for all metrics (0.0-1.0)
                        maximum: 1
                        minimum: 0
                        type: number
                      llmAsAJudgeModel:
                        description: LLM model used for evaluation (e.g., "gemini-2.5-flash-lite")
                        type: string
                      scenarios:
                        description: Test scenarios
                        items:
                          description: Scenario represents a test scenario containing
                            multiple steps
                          properties:
                            name:
                              description: Name of the scenario
                              type: string
                            steps:
                              description: Steps in this scenario
                              items:
                                description: Step represents a single test step within
                                  a scenario
                                properties:
                                  customValues:
                                    description: Custom key-value pairs (e.g., retrieved_contexts)
                                    x-kubernetes-preserve-unknown-fields: true
                                  input:
                                    description: User input to the agent
                                    type: string
                                  metrics:
                                    description: Metrics to evaluate for this step
                                    items:
                                      description: Metric defines a single metric
                                        evaluation configuration
                                      properties:
                                        metricName:
                                          description: Name of the metric (e.g., "ragas_faithfulness",
                                            "tool_check")
                                          type: string
                                        parameters:
                                          description: Additional parameters for the
                                            metric
                                          x-kubernetes-preserve-unknown-fields: true
                                        threshold:
                                          description: Threshold for pass/fail (0.0-1.0)
                                          maximum: 1
                                          minimum: 0
                                          type: number
                                      required:
                                      - metricName
                                      type: object
                                    type: array
                                  reference:
                                    description: Expected reference data for evaluation
                                    properties:
                                      response:
                                        description: Expected response text
                                        type: string
                                      toolCalls:
                                        description: Expected tool calls
                                        items:
                                          description: ToolCall represents an expected
                                            tool invocation
                                          properties:
                                            args:
                                              description: Arguments passed to the
                                                tool (JSON object)
                                              x-kubernetes-preserve-unknown-fields: true
                                            name:
                                              description: Name of the tool
                                              type: string
                                          required:
                                          - name
                                          type: object
                                        type: array
                                      topics:
                                        description: Expected topics to be covered
                                        items:
                                          type: string
                                        type: array
                                    type: object
                                required:
                                - input
                                type: object
                              minItems: 1
                              type: array
                          required:
                          - name
                          - steps
                          type: object
                        minItems: 1
                        type: array
                    required:
                    - scenarios
                    type: object
                  s3:
                    description: S3 source configuration
                    properties:
                      bucket:
                        description: Bucket name
                        type: string
                      key:
                        description: Object key (path to file)
                        type: string
                    required:
                    - bucket
                    - key
                    type: object
                  url:
                    description: URL source (HTTP/HTTPS)
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of s3, url, or inline must be set
                  rule: '(has(self.s3) ? 1 : 0) + (has(self.url) ? 1 : 0) + (has(self.inline)
                    ? 1 : 0) == 1'
              env:
                description: |-
                  Env defines environment variables to inject into the TestWorkflow containers.
                  Uses the standard Kubernetes EnvVar schema (supports value, valueFrom with secretKeyRef, configMapKeyRef, etc.).
                  User-defined env vars override any operator-set vars with the same name.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              schedule:
                description: |-
                  Schedule configures cron-based execution of the experiment workflow.
                  Independent of trigger (event-based execution).
                properties:
                  cron:
                    description: Cron expression (standard Kubernetes cron format,
                      e.g., "0 3 * * *")
                    pattern: ^(\S+\s){4}\S+$
                    type: string
                  timezone:
                    description: IANA timezone name (e.g., "Europe/Berlin"). Defaults
                      to cluster local time.
                    type: string
                required:
                - cron
                type: object
              trigger:
                description: Trigger configuration
                properties:
                  concurrencyPolicy:
                    description: ConcurrencyPolicy defines how concurrent executions
                      are handled
                    enum:
                    - Allow
                    - Forbid
                    - Replace
                    type: string
                  enabled:
                    description: Enabled controls whether the experiment runs automatically
                    type: boolean
                type: object
            required:
            - agentRef
            - dataset
            type: object
          status:
            description: ExperimentStatus defines the observed state of Experiment
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the Experiment's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              generatedResources:
                description: GeneratedResources lists Kubernetes resources created
                  by this Experiment
                items:
                  description: GeneratedResource represents a Kubernetes resource
                    created by this Experiment
                  properties:
                    kind:
                      description: Kind of the resource (e.g., "TestWorkflow")
                      type: string
                    name:
                      description: Name of the resource
                      type: string
                    namespace:
                      description: Namespace of the resource
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              lastExecution:
                description: LastExecution contains metadata about the most recent
                  execution
                properties:
                  endTime:
                    description: EndTime of the execution
                    format: date-time
                    type: string
                  executionId:
                    description: ExecutionID from Testkube
                    type: string
                  executionNumber:
                    description: ExecutionNumber from Testkube
                    type: integer
                  startTime:
                    description: StartTime of the execution
                    format: date-time
                    type: string
                  status:
                    description: Status of the execution
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
