version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true
  # go version is set to 1.25 for compatibility with golangci-lint v2.10.1
  # which was built with go1.25; update when a newer linter release is available.
  go: "1.25"

linters:
  disable-all: true
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    rules:
      - path: "^api/"
        linters:
          - lll
      - path: "^internal/"
        linters:
          - dupl
          - lll
      - path: "(^internal/|^test/|^cmd/)"
        linters:
          - revive
      - path: "^test/"
        linters:
          - staticcheck

linters-settings:
  revive:
    rules:
      - name: comment-spacings
