apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflowTemplate
metadata:
  name: run-template
  namespace: {{ include "testbench.namespace" . }}
  labels:
    {{- include "testbench.labels" . | nindent 4 }}
    {{- include "testbench.workflowLabels" . | nindent 4 }}

spec:
  # Configuration parameters that can be overridden
  config:
    agentUrl:
      type: string
      description: "URL to the agent endpoint (A2A protocol)"
    experimentName:
      type: string
      description: "Name of the experiment for OTel labeling"

  # Steps to execute
  steps:
    - name: run
      artifacts:
        paths:
          - "data/experiments/executed_experiment.json"
      run:
        image: {{ include "testbench.image" . }}
        args:
          - run.py
          - "{{`{{ config.agentUrl }}`}}"
          - "{{`{{ config.experimentName }}`}}"
