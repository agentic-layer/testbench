apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflowTemplate
metadata:
  name: visualize-template
  namespace: {{ include "testbench.namespace" . }}
  labels:
    {{- include "testbench.labels" . | nindent 4 }}
    {{- include "testbench.workflowLabels" . | nindent 4 }}

spec:
  # Configuration parameters that can be overridden
  config:
    experimentName:
      type: string
      description: "Name of the experiment for report labeling"

  # Steps to execute
  steps:
    - name: visualize-metrics
      artifacts:
        paths:
          - "data/results/evaluation_report.html"
      run:
        image: {{ include "testbench.image" . }}
        args:
          - visualize.py
          - "{{`{{ config.experimentName }}`}}"
          - "{{`{{ execution.id }}`}}"
          - "{{`{{ execution.number }}`}}"
