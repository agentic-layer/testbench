kind: Namespace
apiVersion: v1
metadata:
  name: sample-agents
---
apiVersion: runtime.agentic-layer.ai/v1alpha1
kind: Agent
metadata:
  labels:
    app.kubernetes.io/name: agent-runtime-operator
    app.kubernetes.io/managed-by: kustomize
  name: weather-agent
  namespace: sample-agents
spec:
  framework: google-adk
  image: ghcr.io/agentic-layer/weather-agent:0.6.4
  protocols:
    - type: A2A
  exposed: true
  envFrom:
    - configMapRef:
        name: otel-config
        optional: true